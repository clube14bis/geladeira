<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#F2F2F7" />
    <title>Administração | Geladeira 14 Bis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      :root {
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #11262c;
        background: #959596;
        font-size: 17px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #959596;
      }
      button,
      input {
        font: inherit;
      }
      button {
        border: 0;
        cursor: pointer;
        font-weight: 850;
        letter-spacing: 0.06em;
      }
      main {
        width: min(1100px, 100%);
        margin: auto;
        padding: 28px 16px 60px;
      }
      .logo {
        display: block;
        width: 170px;
        height: 130px;
        margin: 0 auto 14px;
        object-fit: contain;
      }
      .cartao {
        max-width: 450px;
        margin: auto;
        padding: 30px;
        border: 1px solid #dce6e3;
        border-radius: 25px;
        background: #fff;
        box-shadow: 0 18px 45px #16323718;
      }
      h1,
      h2 {
        margin: 0;
        text-transform: uppercase;
      }
      h1 {
        text-align: center;
        font-size: 1.85rem;
      }
      p {
        line-height: 1.5;
      }
      .sub {
        color: #63777c;
        text-align: center;
        font-size: 0.84rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      label {
        display: block;
        margin: 15px 0 7px;
        font-size: 0.8rem;
        font-weight: 850;
        letter-spacing: 0.09em;
      }
      input {
        width: 100%;
        height: 52px;
        padding: 0 14px;
        border: 1px solid #d5e0de;
        border-radius: 13px;
        background: #f6f8f8;
      }
      button.primario {
        width: 100%;
        height: 55px;
        margin-top: 20px;
        border-radius: 14px;
        color: #fff;
        background: #1976d2;
      }
      .erro,
      .mensagem {
        min-height: 20px;
        text-align: center;
        font-size: 0.78rem;
        font-weight: 700;
      }
      .erro {
        color: #c43838;
      }
      .topo {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 22px;
        padding: 16px 18px;
        border-radius: 18px;
        background: #fff;
        border: 1px solid #dce6e3;
      }
      .topo p {
        margin: 4px 0 0;
        color: #63777c;
        font-size: 0.84rem;
        text-transform: uppercase;
      }
      .sair {
        padding: 12px 16px;
        border-radius: 11px;
        background: #eef3f4;
        color: #17333a;
      }
      .ajuda {
        margin: 0 0 18px;
        padding: 14px 16px;
        border-radius: 14px;
        background: #e8f2ff;
        color: #164f8d;
        font-size: 0.9rem;
        font-weight: 650;
        line-height: 1.5;
      }
      .grupo-admin {
        margin: 22px 0;
      }
      .grupo-admin h2 {
        margin: 0 0 10px;
        font-size: 1rem;
        letter-spacing: 0.13em;
      }
      .linha-produto {
        display: grid;
        grid-template-columns: 64px minmax(150px, 1fr) 82px minmax(96px, 112px) minmax(96px, 112px) 42px;
        align-items: center;
        gap: 12px;
        margin: 8px 0;
        padding: 10px 12px;
        border: 1px solid #dce6e3;
        border-radius: 15px;
        background: #fff;
      }
      .linha-produto img {
        width: 58px;
        height: 58px;
        object-fit: contain;
        background: #fff;
      }
      .nome-produto {
        font-size: 1rem;
        font-weight: 900;
      }
      .linha-produto label {
        margin: 0;
        font-size: 0.72rem;
      }
      .linha-produto label input:not([type="checkbox"]) {
        height: 39px;
        margin-top: 5px;
        padding: 0 9px;
        font-size: 0.94rem;
      }
      .chave {
        display: flex !important;
        align-items: center;
        gap: 6px;
      }
      .chave input {
        width: 18px;
        height: 18px;
      }
      .remover-produto {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 11px;
        background: #fff0f0;
        color: #c43838;
        font-size: 1.35rem;
        line-height: 1;
      }
      .acoes {
        position: sticky;
        bottom: 12px;
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 26px;
        padding: 14px;
        border-radius: 18px;
        background: #ffffffeb;
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 28px #1632371c;
      }
      .acoes button {
        height: 56px;
        padding: 0 24px;
        border-radius: 14px;
        color: #fff;
        background: #1976d2;
      }
      .mensagem {
        margin: 8px 0;
        color: #168757;
      }
      @media (max-width: 720px) {
        main {
          padding: 18px 10px 42px;
        }
        .linha-produto {
          grid-template-columns: 58px 1fr 42px;
          gap: 8px;
          align-items: center;
          padding: 12px 10px;
        }
        .linha-produto img { grid-column: 1; grid-row: 1 / span 4; }
        .nome-produto {
          font-size: 0.9rem;
          grid-column: 2;
          grid-row: 1;
          min-width: 0;
          overflow-wrap: anywhere;
        }
        .linha-produto .chave {
          grid-column: 2;
          grid-row: 2;
        }
        .linha-produto .preco-campo {
          grid-column: 2;
          width: 100%;
        }
        .remover-produto {
          grid-column: 3;
          grid-row: 1;
          align-self: start;
          justify-self: end;
        }
        .topo h1 {
          font-size: 1.15rem;
        }
        .topo {
          align-items: flex-start;
        }
        .acoes button {
          width: 100%;
        }
      }
      .novo-produto {
        margin: 0 0 24px;
        padding: 18px;
        border: 1px solid #cfe0f3;
        border-radius: 18px;
        background: #fff;
      }
      .novo-produto h2 {
        margin: 0 0 14px;
        font-size: 1rem;
        letter-spacing: 0.1em;
      }
      .novo-grid {
        display: grid;
        grid-template-columns: 2fr 1.2fr 2fr 1fr 1.3fr;
        gap: 10px;
        align-items: end;
      }
      .novo-grid label {
        margin: 0;
        font-size: 0.72rem;
      }
      .novo-grid input,
      .novo-grid select {
        width: 100%;
        height: 42px;
        margin-top: 5px;
        padding: 0 9px;
        border: 1px solid #d5e0de;
        border-radius: 10px;
        background: #f6f8f8;
      }
      .novo-grid button {
        height: 42px;
        border-radius: 10px;
        color: #fff;
        background: #1976d2;
        font-size: 0.74rem;
      }
      @media (max-width: 720px) {
        .novo-grid {
          grid-template-columns: 1fr 1fr;
        }
        .novo-grid label:first-child,
        .novo-grid label:nth-child(3),
        .novo-grid button {
          grid-column: 1/-1;
        }
      }
      :root { font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-size: clamp(17px, 1vw + 13px, 19px); }
      body, button, input, select, textarea, h1, h2, h3, label, .sub, .topo p { text-transform: uppercase !important; letter-spacing: .045em !important; }
      input, select { border-radius: 15px; background: rgba(255,255,255,.8); box-shadow: inset 0 1px 1px rgba(0,0,0,.03); transition: border-color .2s, box-shadow .2s; }
      input:focus, select:focus { outline: 0; border-color: #0071e3; box-shadow: 0 0 0 4px rgba(0,113,227,.15); }
      button { transition: transform .2s, box-shadow .2s, background .2s; }
      button:hover { transform: translateY(-1px); }
      button.primario { background: linear-gradient(135deg,#0a84ff,#0071e3); box-shadow: 0 10px 22px rgba(0,113,227,.25); }
      body, button, input, select, textarea { text-transform: none !important; }
    </style>
  </head>
  <body>
    <main>
      <section id="login-admin">
        <img class="logo" src="logo14bis.png" alt="Clube 14 Bis" />
        <div class="cartao">
          <h1>Painel administrativo</h1>
          <p class="sub">Configuração da geladeira</p>
          <form id="form-admin">
            <label
              >Usuário<input
                id="admin-usuario"
                autocomplete="username"
                required /></label
            ><label
              >Senha<input
                id="admin-senha"
                type="password"
                autocomplete="current-password"
                required /></label
            ><button class="primario" type="submit">Entrar no painel</button>
          </form>
          <p id="erro-admin" class="erro"></p>
        </div>
      </section>
      <section id="painel-admin" hidden>
        <header class="topo">
          <div>
            <h1>Produtos da geladeira</h1>
          </div>
          <button id="sair-admin" class="sair">Sair</button>
        </header>
        <section class="novo-produto">
          <h2>Adicionar novo produto</h2>
          <div class="novo-grid">
            <label>Nome<input id="novo-nome" maxlength="80" /></label
            ><label
              >Categoria<select id="novo-categoria">
                <option>ÁGUA</option>
                <option>REFRIGERANTES E OUTROS</option>
                <option>CERVEJAS</option>
                <option>SUCOS</option>
                <option>OUTROS PRODUTOS</option>
                <option>ALIMENTOS</option>
              </select></label
            ><label
              >Link ou arquivo da imagem<input
                id="nova-imagem"
                placeholder="HTTPS://... OU MINHA-BEBIDA.PNG" /></label
            ><label
              >Preço<input
                id="novo-preco"
                inputmode="decimal"
                placeholder="0,00" /></label
            ><label
              >Quantidade disponível<input
                id="novo-estoque"
                inputmode="numeric"
                min="0"
                value="0" /></label
            ><button id="adicionar-produto" type="button">
              ADICIONAR PRODUTO
            </button>
          </div>
        </section>
        <div id="produtos-admin"></div>
        <div class="acoes"><button id="salvar">Salvar alterações</button></div>
        <p id="mensagem-admin" class="mensagem"></p>
      </section>
    </main>
    <script type="module" src="admin.js?v=1.4.1"></script>
  </body>
</html>
